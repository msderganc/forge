manifest_version: 1
skill: plan
# Parser/medium max_step stays 7. skill_runner collapses plan+light to 3
# (Frame+Orient / Act / Handoff); ceremony must not steal a mode variant key.
max_step: 7
cli_flags:
  - name: "--force"
    type: bool
    default: false
    help: "Overwrite an existing plan file at step 1 even if it contains content."
  - name: "--ceremony"
    type: str
    default: null
    choices: ["light", "medium", "detailed", "comprehensive"]
    help: "Ceremony band (process depth). Overrides estimate."
  - name: "--save-ceremony-preference"
    type: bool
    default: false
    help: "When used with --ceremony, persist that band as the default for future plan sessions."
steps:
  - step: 1
    phase: Frame
    prompt: plan/context
    variables_callable: "scripts.plan.plan_vars:build_variables"
    todos:
      - content: Read handoff-design.md and memory files
        activeForm: Reading handoff and memory
      - content: Initialize plan state
        activeForm: Initializing state
  - step: 2
    phase: Orient — Architecture
    prompt: plan/architecture
    variables_callable: "scripts.plan.plan_vars:build_variables"
    todos:
      - content: Dispatch Architect for architecture design
        activeForm: Dispatching Architect
      - content: Wait for architecture artifacts
        activeForm: Waiting for architecture
  - step: 3
    phase: Deepen — Plan Creation
    prompt: plan/creation
    variables_callable: "scripts.plan.plan_vars:build_variables"
    todos:
      - content: Dispatch Planner with INVEST validation
        activeForm: Dispatching Planner
      - content: Validate each task against INVEST criteria
        activeForm: Validating INVEST
  - step: 4
    phase: Deepen — Review
    prompt: plan/review_loop
    variables_callable: "scripts.plan.plan_vars:build_variables"
    todos:
      - content: Run 4-step review loop on plan
        activeForm: Running plan review loop
      - content: Record and resolve findings
        activeForm: Resolving findings
  - step: 5
    phase: Decide
    prompt: plan/approval
    variables_callable: "scripts.plan.plan_vars:build_variables"
    todos:
      - content: Run pre-mortem analysis on plan
        activeForm: Running pre-mortem
      - content: Present plan to user for approval
        activeForm: Presenting plan for approval
  - step: 6
    phase: Verify — Documentation
    prompt: plan/documentation
    variables_callable: "scripts.plan.plan_vars:build_variables"
    todos:
      - content: Define documentation scope and audience applicability
        activeForm: Planning documentation
      - content: Confirm external wiki and repo doc targets
        activeForm: Confirming doc targets
  - step: 7
    phase: Handoff
    prompt: plan/handoff
    variables_callable: "scripts.plan.plan_vars:build_variables"
    todos:
      - content: Write handoff file for implement skill
        activeForm: Writing handoff
      - content: Render dashboard and complete
        activeForm: Rendering dashboard
gates:
  # Soften probe injection at light; plan_skeleton integrity stays hard.
  - id: architecture_probes
    steps: [2]
    kind: python
    callable: "scripts.plan.plan_vars:maybe_inject_architecture_probes"
    soft_when: ["light"]
  - id: plan_skeleton
    steps: [7]
    kind: python
    callable: "scripts.plan.plan_vars:exit_if_plan_skeleton_incomplete"
