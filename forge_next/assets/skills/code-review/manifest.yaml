manifest_version: 1
skill: code-review
max_step: 6
handoff_skill: test
cli_flags:
  - name: "--mode"
    type: str
    default: null
    choices: ["pr", "deep", "architecture"]
    help: "Review mode"
  - name: "--target"
    type: list
    default: null
    help: "PR number, branch, or files"
  - name: "--plan"
    type: str
    default: null
    help: "Plan path or keywords"
  - name: "--effort"
    type: str
    default: null
    choices: ["light", "standard", "thorough"]
    help: "Review effort"
  - name: "--no-structural"
    type: bool
    default: false
    help: "Disable structural Pass B"
  - name: "--allow-structural-probes-incomplete"
    type: bool
    default: false
    help: "Bypass structural probes gate"
  - name: "--structural-probes-override-reason"
    type: str
    default: ""
    help: "Override reason for structural probes gate"
  - name: "--structural-probes-override-follow-up"
    type: str
    default: ""
    help: "Override follow-up for structural probes gate"
steps:
  - step: 1
    phase: Target Detection
    prompt: code-review/target_detection
    variables_callable: "scripts.code_review.code_review_vars:build_variables"
    todos:
      - content: Detect PR/branch/files target
        activeForm: Detecting review target
      - content: Read handoff-implement.md
        activeForm: Reading handoff
  - step: 2
    phase: Mode Selection
    prompt: code-review/mode_selection
    variables_callable: "scripts.code_review.code_review_vars:build_variables"
    todos:
      - content: Select review mode (pr/deep/architecture)
        activeForm: Selecting mode
  - step: 3
    phase: Team Dispatch
    prompt: code-review/diff_analysis
    variables_callable: "scripts.code_review.code_review_vars:build_variables"
    todos:
      - content: Run forge step 3 (orchestrator runs pyscn/knip/madge; read .structural-probes.json)
        activeForm: Running structural probes and team dispatch
      - content: Cite pyscn finding IDs in Pass B before dispatching reviewers
        activeForm: Incorporating pyscn results
      - content: Write findings or advance when time-boxed (do not block on every subagent)
        activeForm: Recording findings
  - step: 4
    phase: Deep Dive
    prompt: code-review/deep_dive
    variables_callable: "scripts.code_review.code_review_vars:build_variables"
    todos:
      - content: Dispatch Investigator for deep dive on critical findings
        activeForm: Deep-diving critical findings
  - step: 5
    phase: Discussion
    prompt: code-review/discussion
    variables_callable: "scripts.code_review.code_review_vars:build_variables"
    todos:
      - content: Run interactive triage with user
        activeForm: Running triage with user
      - content: Resolve or dismiss findings
        activeForm: Resolving findings
  - step: 6
    phase: Report
    prompt: code-review/report
    variables_callable: "scripts.code_review.code_review_vars:build_variables"
    todos:
      - content: Write code review report
        activeForm: Writing report
      - content: Write handoff and render dashboard
        activeForm: Writing handoff
gates:
  - id: structural_inject
    steps: [3]
    kind: python
    callable: "scripts.code_review.code_review_vars:maybe_inject_structural_probes"
  - id: structural_probes_gate
    steps: [4, 5, 6]
    kind: python
    callable: "scripts.code_review.code_review_vars:exit_if_structural_probes_gate_fails"
