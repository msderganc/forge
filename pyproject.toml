[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-next"
version = "1.16.0"
description = "Forge Codex: install-once workflow orchestrators for Cursor/Codex"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Forge Codex" }]

dependencies = [
    "tomlkit>=0.12,<2",
    "PyYAML>=6.0,<7",
    "jsonschema>=4.18,<5",
]

[project.urls]
Homepage = "https://github.com/msderganc/forge"
Repository = "https://github.com/msderganc/forge"
Issues = "https://github.com/msderganc/forge/issues"

[project.scripts]
forge = "forge_next.cli:main"
codex-agents = "forge_next.codex_agents:main"
claude-graphify = "forge_next.claude_graphify:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_next*", "scripts*"]

[tool.setuptools.package-data]
forge_next = [
  "assets/**/*.md",
  "assets/studio/**",
  "assets/skills/**/*.yaml",
  "assets/schemas/**/*.json",
]

